<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ElectricityMod Editor</title>

  <style>
    body {
      margin: 0;
      background: #1e1e1e;
      color: white;
      font-family: Arial, sans-serif;
    }

    .menu-bar {
      background: #333;
      padding: 10px;
      display: flex;
      gap: 10px;
    }

    .main {
      display: flex;
      height: calc(100vh - 50px);
    }

    .toolbox {
      width: 220px;
      background: #252525;
      padding: 10px;
      overflow-y: auto;
    }

    .category h3 {
      margin: 10px 0 5px;
    }

    .block {
      background: #3a3a3a;
      padding: 6px 8px;
      margin-bottom: 5px;
      border-radius: 6px;
      cursor: pointer;
    }

    .workspace {
      flex: 1;
      background: #2e2e2e;
      padding: 10px;
      overflow-y: auto;
    }

    .workspace-block {
      background: #444;
      padding: 6px 8px;
      margin-bottom: 5px;
      border-radius: 6px;
    }

    .stage {
      width: 480px;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      background: #111;
      border-radius: 4px;
    }
  </style>
</head>

<body>

  <!-- MENU BAR -->
  <div class="menu-bar">
    <button id="btn-start">▶️ Start</button>
    <button id="btn-stop">⏹️ Stop</button>

    <!-- YOU WILL SEE THIS BUTTON -->
    <button id="btn-save" style="background:#00aaff;color:white;padding:6px 10px;border:none;border-radius:4px;">
      💾 SAVE .ZAP
    </button>
  </div>

  <!-- MAIN EDITOR -->
  <div class="main">
    <div class="toolbox" id="toolbox"></div>
    <div class="workspace" id="workspace"></div>

    <div class="stage">
      <canvas id="stageCanvas" width="480" height="360"></canvas>
    </div>
  </div>

  <!-- SCRIPT START -->
  <script>

    // -------------------------------
    // ELECTRICITYMOD VM (simple demo)
    // -------------------------------
    class ElectricityVM {
      constructor() {
        this.running = false;
        this.listeners = {};
      }

      start() {
        this.running = true;
        this.emit("started");
      }

      stop() {
        this.running = false;
        this.emit("stopped");
      }

      updateScripts(scripts) {
        this.emit("scriptsUpdated", scripts);
      }

      tick() {
        if (!this.running) return;
        this.emit("tick");
      }

      on(event, fn) {
        if (!this.listeners[event]) this.listeners[event] = [];
        this.listeners[event].push(fn);
      }

      emit(event, data) {
        (this.listeners[event] || []).forEach(fn => fn(data));
      }
    }

    const vm = new ElectricityVM();


    // -------------------------------
    // STAGE RENDER LOOP
    // -------------------------------
    const canvas = document.getElementById("stageCanvas");
    const ctx = canvas.getContext("2d");

    function renderFrame() {
      ctx.fillStyle = "#111";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = vm.running ? "#00ff88" : "#ff4444";
      ctx.font = "20px Arial";
      ctx.fillText(vm.running ? "RUNNING" : "STOPPED", 20, 40);
    }

    function loop() {
      vm.tick();
      renderFrame();
      requestAnimationFrame(loop);
    }
    loop();


    // -------------------------------
    // TOOLBOX
    // -------------------------------
    const categories = [
      {
        name: "Electricity",
        blocks: [
          { id: "power_on", label: "Power On" },
          { id: "power_off", label: "Power Off" },
          { id: "pulse", label: "Pulse Signal" }
        ]
      },
      {
        name: "Control",
        blocks: [
          { id: "repeat", label: "Repeat" },
          { id: "wait", label: "Wait" }
        ]
      }
    ];

    const toolboxEl = document.getElementById("toolbox");
    const workspaceEl = document.getElementById("workspace");
    const scripts = [];

    categories.forEach(cat => {
      const catDiv = document.createElement("div");
      catDiv.className = "category";

      const title = document.createElement("h3");
      title.textContent = cat.name;
      catDiv.appendChild(title);

      cat.blocks.forEach(block => {
        const blockDiv = document.createElement("div");
        blockDiv.className = "block";
        blockDiv.textContent = block.label;

        blockDiv.addEventListener("click", () => {
          scripts.push(block);
          renderWorkspace();
          vm.updateScripts(scripts);
        });

        catDiv.appendChild(blockDiv);
      });

      toolboxEl.appendChild(catDiv);
    });


    // -------------------------------
    // WORKSPACE
    // -------------------------------
    function renderWorkspace() {
      workspaceEl.innerHTML = "";
      scripts.forEach(b => {
        const div = document.createElement("div");
        div.className = "workspace-block";
        div.textContent = b.label;
        workspaceEl.appendChild(div);
      });
    }


    // -------------------------------
    // BUTTONS
    // -------------------------------
    document.getElementById("btn-start").onclick = () => vm.start();
    document.getElementById("btn-stop").onclick = () => vm.stop();


    // ------------------------------------------------------
    // ⚡🐧 SAVE BUTTON — YOU WILL SEE THIS — .ZAP FORMAT
    // ------------------------------------------------------
    document.getElementById("btn-save").onclick = () => {

      const data = JSON.stringify({ scripts }, null, 2);

      const blob = new Blob([data], { type: "application/zap" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = "electricitymod-project.zap";
      a.click();

      URL.revokeObjectURL(url);
    };

  </script>
  <!-- SCRIPT END -->

</body>
</html>
